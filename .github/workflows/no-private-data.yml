name: no-private-data

# Refuse any change that carries operator-private data into this public repo. Runs the structural
# layer of scripts/check-no-private-data.sh on every push and PR. The literal .private-denylist
# layer is git-ignored, so it does not run here - that is the maintainer's local pre-push job, or
# wire it in as a repository secret if you want it enforced in CI too.
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for operator-private data
        run: bash scripts/check-no-private-data.sh
