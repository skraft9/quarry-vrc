<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260"
     role="img" aria-label="Quarry - a console for vulnerability research at scale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#151d28"/>
    </linearGradient>
    <linearGradient id="facetL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ee0c2"/>
      <stop offset="1" stop-color="#2b9d86"/>
    </linearGradient>
    <linearGradient id="facetR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37c2a8"/>
      <stop offset="1" stop-color="#1d7a68"/>
    </linearGradient>
  </defs>

  <rect width="880" height="260" fill="url(#bg)"/>

  <!-- Facet field, mirrored about the centre line so the panel reads as cut stone and the
       symmetry carries the eye to the middle rather than off to one side. -->
  <g stroke="#37c2a8" stroke-width="1" opacity="0.07" fill="none">
    <path d="M440 8 L160 130 L440 252 L720 130 Z"/>
    <path d="M440 8 L280 130 L440 252 L600 130 Z"/>
    <path d="M0 130 H880"/>
    <path d="M160 130 L440 8 M720 130 L440 8 M160 130 L440 252 M720 130 L440 252"/>
  </g>

  <!-- The mark, centred on x=440. Same brilliant cut as the app's brand and favicon. -->
  <g transform="translate(440 30) scale(3.9) translate(-12 0)">
    <path d="M7 3h10l4.5 6L12 21.5 2.5 9z" fill="#0d1117" stroke="#37c2a8" stroke-width="1.5"
          stroke-linejoin="round"/>
    <path d="M7 3 9.5 9 12 21.5 2.5 9z" fill="url(#facetL)" opacity="0.9"/>
    <path d="M17 3 14.5 9 12 21.5 21.5 9z" fill="url(#facetR)" opacity="0.75"/>
    <path d="M9.5 9h5l-2.5 12.5z" fill="#8ff0d8" opacity="0.55"/>
    <g stroke="#0d1117" stroke-width="0.9" stroke-linejoin="round" fill="none" opacity="0.85">
      <path d="M2.5 9h19"/><path d="M7 3 9.5 9 12 21.5 14.5 9 17 3"/>
    </g>
  </g>

  <text x="440" y="182" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="56" font-weight="700" fill="#e6edf3" letter-spacing="9">QUARRY</text>
  <text x="440" y="212" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="15" fill="#37c2a8" letter-spacing="3.4">VULNERABILITY RESEARCH CONSOLE</text>
</svg>
