<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<!-- Title, brand, login heading and favicon are all set at boot from the server's
     `app_name` (GET /api/health). These are placeholders only. See RENAME.md. -->
<title>Console</title>
<link rel="icon" type="image/svg+xml" href="data:,">
<link rel="stylesheet" href="app.css">
<!-- app.js is loaded (not deferred) in <head> so the stored theme is applied to <html>
     before first paint. Everything else in it waits for DOMContentLoaded.
     CSP: strict. No inline <script>, no <style>, no style="" attributes, no on* attributes. -->
<script src="app.js"></script>
</head>
<body>

<!-- ------------------------------------------------------------- boot -->
<div id="boot" class="boot">
  <div class="boot-inner">
    <div class="spinner" aria-hidden="true"></div>
    <p class="boot-msg">Starting&hellip;</p>
  </div>
</div>

<!-- ------------------------------------------------------------- login -->
<div id="login" class="login" hidden>
  <form id="login-form" class="login-card card" autocomplete="on">
    <h1 class="login-title">Console</h1>
    <p class="login-sub">Vulnerability research console. Sign in to continue.</p>

    <label class="field">
      <span class="field-label">Username</span>
      <input id="login-user" name="username" type="text" autocomplete="username" required autocapitalize="none" spellcheck="false">
    </label>

    <label class="field">
      <span class="field-label">Password</span>
      <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
    </label>

    <div id="login-error" class="alert alert-error" hidden></div>

    <button id="login-submit" class="btn btn-primary btn-block" type="submit">Sign in</button>

    <p class="login-foot">Session cookie is <code>HttpOnly</code> + <code>SameSite=Strict</code>.</p>
  </form>
</div>

<!-- ------------------------------------------------------------- app -->
<div id="app" class="app" hidden>

  <header class="topbar">
    <a class="brand" href="#/dashboard">
      <!-- A brilliant-cut gem: a quarry is both the place a valuable thing is extracted from
           and the thing being hunted, which is the whole job. Inline rather than a file so there
           is no second request and no CDN, and stroked in currentColor so it follows the theme
           and the accent without a second copy for dark mode. -->
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linejoin="round" stroke-linecap="round">
          <path d="M7 3h10l4.5 6L12 21.5 2.5 9z"/>
          <path d="M2.5 9h19"/>
          <path d="M7 3 9.5 9 12 21.5 14.5 9 17 3"/>
        </svg>
      </span>
      <span class="brand-text">Console</span>
    </a>

    <!-- The version also renders bottom-left in the sidebar rail. On a phone that rail becomes a
         horizontally scrolling tab strip, so it scrolls out of view and the running build is
         unidentifiable - which is exactly when it is most likely to be asked about. This copy
         sits in the topbar and is shown on phones only; the desktop keeps the rail's. -->
    <span id="topversion" class="topversion" title="Running build"></span>

    <form id="globalsearch" class="globalsearch" role="search">
      <label class="sr-only" for="globalsearch-input">Search everything</label>
      <span class="gs-field">
        <span class="gs-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg></span>
        <input id="globalsearch-input" type="search" placeholder="Search everything&hellip;" autocomplete="off" spellcheck="false">
        <span class="gs-key" aria-hidden="true">/</span>
      </span>
      <!-- Kept for the phone layout, where Enter is awkward; hidden on desktop, where the field
           submits on Enter and the mockup shows only the "/" keycap. -->
      <button class="btn btn-quiet gs-submit" type="submit">Search</button>
    </form>

    <div class="topbar-right">
      <div class="profilemenu">
        <button id="profilebtn" class="profilebtn" type="button" aria-haspopup="true" aria-expanded="false" title="Account">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.4 3.6-6 8-6s8 2.6 8 6"/></svg>
        </button>
        <div id="profiledropdown" class="profiledropdown" role="menu" hidden>
          <div class="pd-user"><span id="userchip"></span></div>
          <div class="pd-sep"></div>
          <div class="pd-grouplabel">Theme</div>
          <div class="pd-themes">
            <button class="pd-theme" type="button" data-theme="auto">Auto</button>
            <button class="pd-theme" type="button" data-theme="light">Light</button>
            <button class="pd-theme" type="button" data-theme="dark">Dark</button>
          </div>
          <div class="pd-sep"></div>
          <button id="logoutbtn" class="pd-item pd-logout" type="button">Log out</button>
        </div>
      </div>
    </div>
  </header>

  <div class="shell">
    <nav id="nav" class="sidebar" aria-label="Primary"></nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

</div>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

</body>
</html>
